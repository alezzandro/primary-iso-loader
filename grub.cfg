set timeout=5
set timeout_style=menu
set default=0

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod linux
insmod search
insmod search_label
insmod gzio
insmod ext2
insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus
insmod all_video

# Some UEFI firmware connects only the boot disk. Reconnect PCI and SCSI
# handles so the attached ISO appears as cd0. Any later CD is ignored.
connectefi pciroot
connectefi scsi

# Load the ISO's own GRUB configuration. Two layouts are supported:
#   Assisted Installer discovery: (cd0)/EFI/redhat/grub.cfg
#   Red Hat Enterprise Linux DVD: (cd0)/EFI/BOOT/grub.cfg
# Chainloading the ISO's EFI binary drops the device path, so its menu
# never appears. The ISO configuration carries the kernel path, initrds,
# and arguments (including the discovery rootfs URL).
menuentry "Boot attached ISO" {
    if [ -f (cd0)/EFI/redhat/grub.cfg ]; then
        set root=(cd0)
        echo "Loading (cd0)/EFI/redhat/grub.cfg"
        configfile (cd0)/EFI/redhat/grub.cfg
    fi
    if [ -f (cd0)/EFI/BOOT/grub.cfg ]; then
        set root=(cd0)
        echo "Loading (cd0)/EFI/BOOT/grub.cfg"
        configfile (cd0)/EFI/BOOT/grub.cfg
    fi
    if [ -f (cd0,msdos2)/EFI/redhat/grub.cfg ]; then
        set root=(cd0)
        echo "Loading (cd0,msdos2)/EFI/redhat/grub.cfg"
        configfile (cd0,msdos2)/EFI/redhat/grub.cfg
    fi
    if [ -f (cd0,msdos2)/EFI/BOOT/grub.cfg ]; then
        set root=(cd0)
        echo "Loading (cd0,msdos2)/EFI/BOOT/grub.cfg"
        configfile (cd0,msdos2)/EFI/BOOT/grub.cfg
    fi

    echo "No discovery or installation ISO found on cd0."
    set root=(hd0,gpt1)
    chainloader /EFI/BOOT/show-mac.efi
    boot
}
